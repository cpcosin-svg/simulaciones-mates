<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Laboratorio de límites y continuidad</title>
<style>
:root{--bg:#fafaf7;--fg:#1c1c1a;--mu:#6b6b66;--card:#fff;--bd:#dcdcd4;--ac:#1d5fd6;--ok:#12813a;--ko:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181a;--fg:#ecece8;--mu:#9a9a94;--card:#222427;--bd:#3a3c40;--ac:#6ea0ff;--ok:#4cc27a;--ko:#ff7b6b}}
:root[data-theme=dark]{--bg:#17181a;--fg:#ecece8;--mu:#9a9a94;--card:#222427;--bd:#3a3c40;--ac:#6ea0ff;--ok:#4cc27a;--ko:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.4rem;margin:.2em 0}.sub{color:var(--mu);margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button,select,input:not([type=checkbox]){font:inherit;padding:7px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.card,.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:10px 0}
#fx{font-size:1.25rem;overflow-x:auto;padding:18px 16px}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px}.fr>span:first-child{border-bottom:1.5px solid var(--fg);padding:0 5px}
.pw{display:inline-flex;align-items:center;vertical-align:middle}.bc{font-size:3.4em;font-weight:200;margin:0 8px 0 4px}.rows{text-align:left;line-height:2.1}
.ql{margin-bottom:6px}.ck{display:block;padding:2px 0}.r{margin-top:6px;font-weight:600}.r.ok{color:var(--ok)}.r.ko{color:var(--ko)}
canvas{display:block;width:100%;height:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}canvas[hidden]{display:none}
</style></head><body><div class="wrap">
<h1>Laboratorio de límites y continuidad</h1>
<p class="sub">Resuelve a mano y comprueba. Admite números, fracciones (1/2), e, ∞ y −∞. Después compara con la gráfica.</p>
<div class="bar"><select id="fam"><option value="0">Función al azar</option><option value="R">Racional</option><option value="P">A trozos</option><option value="K">A trozos con parámetro k</option><option value="E">Exponencial, logarítmica, trigonométrica</option></select><button id="nw">Nueva función</button></div>
<div class="card" id="fx"></div><div id="qs"></div>
<div class="bar"><button id="ck">Corregir</button><button id="gr" class="sec">Mostrar gráfica</button><span id="sc"></span></div>
<canvas id="cv" width="760" height="420" hidden></canvas></div>
<script>
const $=i=>document.getElementById(i),R=Math.random,ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pk=a=>a[ri(0,a.length-1)];
const nz=(a,b)=>{let v=0;while(!v)v=ri(a,b);return v},shuf=a=>a.map(v=>[R(),v]).sort((p,q)=>p[0]-q[0]).map(v=>v[1]);
const u=(n,a,b)=>{const s=new Set;while(s.size<n)s.add(ri(a,b));return[...s]};
const sup=['','','²','³'];
function ps(c){const d=c.length-1;let o='';c.forEach((k,i)=>{const e=d-i;if(!k)return;const a=Math.abs(k);let t=(a==1&&e)?'':a;t+=e?'x'+(e>1?sup[e]:''):'';o+=o?(k<0?' − ':' + ')+t:(k<0?'−':'')+t});return o||'0'}
const pe=(c,x)=>c.reduce((s,k)=>s*x+k,0),pm=(a,b)=>{const r=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y));return r};
const rt=r=>r.reduce((p,s)=>pm(p,[1,-s]),[1]),sh=a=>a?`x ${a>0?'−':'+'} ${Math.abs(a)}`:'x',add=s=>s?(s>0?` + ${s}`:` − ${-s}`):'';
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const fm=v=>{if(v===Infinity)return'+∞';if(v===-Infinity)return'−∞';for(let q=1;q<=12;q++){const p=Math.round(v*q);if(Math.abs(v-p/q)<.0011)return(q==1?''+p:p+'/'+q).replace('-','−')}return v.toFixed(2).replace('-','−')};
const obl=(m,n)=>`y = ${m==1?'':m==-1?'−':Number.isInteger(m)?fm(m):'('+fm(m)+')'}x${n?(n>0?' + ':' − ')+fm(Math.abs(n)):''}`;
const lim=v=>v!==v?NaN:Math.abs(v)>1e4?(v>0?Infinity:-Infinity):Math.round(v*1000)/1000;
const CO=['Continua','Discontinuidad evitable','Salto finito','Salto infinito','No procede: x = a no está en el dominio'];
/* ---------- generadores ---------- */
function gR1(){const[h,r,s]=u(3,-4,4),k=pk([1,2,-1,3]),N=pm([k],rt([h,r])),D=rt([h,s]);
 return{t:`f(x) = ${fr(ps(N),ps(D))}`,f:x=>k*(x-h)*(x-r)/((x-h)*(x-s)),brk:[h,s],a:pk([h,s])}}
function gR2(){const ds=ri(1,2),rs=ds==1?u(1,-4,4):R()<.3?(x=>[x,x])(ri(-3,3)):u(2,-4,4),D=rt(rs),dn=pk([ds-1,ds,ds+1]);let N;
 do{N=Array.from({length:dn+1},()=>ri(-3,3));N[0]=nz(-3,3)}while(rs.some(r=>Math.abs(pe(N,r))<1e-9));
 return{t:`f(x) = ${fr(ps(N),ps(D))}`,f:x=>pe(N,x)/pe(D,x),brk:[...new Set(rs)],a:rs[0]}}
function gP(md){const a=md=='k'?pk([-2,-1,1,2]):ri(-2,3);let L,k=0;
 const lin=()=>{const m=nz(-3,3),n=ri(-4,4);return{s:ps([m,n]),f:x=>m*x+n,v:m*a+n}};
 const qd=()=>{const b=ri(-3,3),c=ri(-4,4);return{s:ps([1,b,c]),f:x=>x*x+b*x+c,v:a*a+b*a+c}};
 const ex=()=>{const c=ri(1,3);return{s:`${c}e<sup>${sh(a)}</sup>`,f:x=>c*Math.exp(x-a),v:c}};
 const rc=()=>({s:fr(ps([1,0,-a*a]),ps([1,-a])),f:x=>(x*x-a*a)/(x-a),v:2*a});
 const ln=()=>({s:`ln(${sh(a-1)})`,f:x=>Math.log(x-a+1),v:0});
 const sq=()=>{const c=ri(1,3);return{s:`√(${ps([1,c*c-a])})`,f:x=>Math.sqrt(x-a+c*c),v:c}};
 if(md=='k'){k=nz(-3,3);const n=ri(-3,3);L={s:'k·x'+add(n),f:x=>k*x+n,v:k*a+n}}else L=pk(md=='inf'?[lin,qd,ex]:[lin,qd,ex,rc])();
 let Rp,Rf,fa,sf=0;const A=fm(a);
 if(md=='inf'){const c=nz(-3,3);Rp={s:fr(c,sh(a))};Rf=x=>c/(x-a)}
 else{Rp=pk([lin,qd,ln,sq])();sf=L.v-Rp.v+(md=='jump'?nz(-3,3):0);Rp.s+=add(sf);Rf=x=>Rp.f(x)+sf}
 fa=md=='rem'?L.v+nz(-3,3):md=='inf'?L.f(a):Rf(a);
 const row=(s,c)=>`${s} &nbsp; si ${c}`;
 const rows=md=='rem'?[row(L.s,`x &lt; ${A}`),row(fa,`x = ${A}`),row(Rp.s,`x &gt; ${A}`)]:md=='inf'?[row(L.s,`x ≤ ${A}`),row(Rp.s,`x &gt; ${A}`)]:[row(L.s,`x &lt; ${A}`),row(Rp.s,`x ≥ ${A}`)];
 return{t:`f(x) = <span class="pw"><span class="bc">{</span><span class="rows">${rows.join('<br>')}</span></span>`,f:x=>x<a?L.f(x):x==a?fa:Rf(x),brk:[a],a,k:k||undefined}}
function gE(){const k=ri(2,3),e=pk([
 {t:`${k}x·e<sup>−x</sup>`,f:x=>k*x*Math.exp(-x),brk:[],a:0},
 {t:fr(`${k} ln x`,'x'),f:x=>x>0?k*Math.log(x)/x:NaN,brk:[0],a:0},
 {t:fr(`${k}e<sup>x</sup>`,'x'),f:x=>k*Math.exp(x)/x,brk:[0],a:0},
 {t:fr(`sen ${k}x`,'x'),f:x=>Math.sin(k*x)/x,brk:[0],a:0},
 {t:fr(`e<sup>${k}x</sup> − 1`,'x'),f:x=>(Math.exp(k*x)-1)/x,brk:[0],a:0}]);e.t='f(x) = '+e.t;return e}
/* ---------- análisis numérico ---------- */
function an(F){const f=F.f,A={p:{},vs:[],hs:[],os:[]};
 const end=s=>{const x1=s*1e6,x2=s*1e7,v1=f(x1),v2=f(x2),L=lim(v2),r={L,h:null,ob:null};
  if(isFinite(L)&&Math.abs(v1-v2)<.02)r.h=Math.round(v2*60)/60;
  else if(Math.abs(L)===Infinity){const m2=v2/x2,m=Math.round(m2*60)/60;
   if(Math.abs(m-m2)<1e-4&&m&&Math.abs(m)<1e3&&Math.abs(v1-m*x1-(v2-m*x2))<.02)r.ob=[m,Math.round((v2-m*x2)*60)/60]}return r};
 A.e=[end(1),end(-1)];
 [...new Set([...F.brk,F.a])].forEach(p=>{const L=lim(f(p-1e-7)),R=lim(f(p+1e-7));A.p[p]={L,R,fa:f(p),v:Math.abs(L)===Infinity||Math.abs(R)===Infinity};if(A.p[p].v)A.vs.push(p)});
 const t=new Set;A.vs.forEach(p=>t.add('x = '+fm(p)));
 A.e.forEach(o=>{if(o.h!==null){A.hs.push(o.h);t.add('y = '+fm(o.h))}if(o.ob){A.os.push(o.ob);t.add(obl(...o.ob))}});A.t=[...t];return A}
/* ---------- interfaz ---------- */
let F,A,qs=[];
function nuevo(){const v=$('fam').value,m=v=='0'?pk(['R','P','K','E']):v;
 F=m=='R'?(R()<.5?gR1():gR2()):m=='P'?gP(pk(['cont','jump','rem','inf'])):m=='K'?gP('k'):gE();A=an(F);qs=[];
 const a=F.a,o=A.p[a],N=(h,v)=>({h,k:'n',ans:v,sol:fm(v)});
 if(F.k)qs.push(N(`Halla <b>k</b> para que f sea continua en x = ${fm(a)}.`,F.k));
 else{[[A.e[0].L,'+∞'],[A.e[1].L,'−∞']].forEach(([v,s])=>v===v&&qs.push(N(`lim<sub>x→${s}</sub> f(x)`,v)));
  [[o.L,'⁻'],[o.R,'⁺']].forEach(([v,s])=>v===v&&qs.push(N(`lim<sub>x→${fm(a)}${s}</sub> f(x)`,v)));
  const ok=x=>Math.abs(x)!==Infinity;
  if(o.L===o.L&&o.R===o.R){let c;if(!isFinite(o.fa))c=4;else if(ok(o.L)&&ok(o.R)&&Math.abs(o.L-o.R)<.01)c=Math.abs(o.fa-o.L)<.01?0:1;else c=ok(o.L)&&ok(o.R)?2:3;
   qs.push({h:`Estudia la continuidad de f en x = ${fm(a)}. <span style="color:var(--mu)">(Recuerda: solo tiene sentido en puntos del dominio.)</span>`,k:'s',ans:CO[c],sol:CO[c]});
   if(c==1||(c==4&&ok(o.L)&&ok(o.R)&&Math.abs(o.L-o.R)<.01))qs.push(N(`¿Qué valor habría que asignar a f(${fm(a)}) para que f (extendida o redefinida) sea continua en x = ${fm(a)}?`,o.L))}
  const pool=[...Object.keys(A.p).map(p=>'x = '+fm(+p)),...shuf(['y = 0','y = 1','y = −1','y = 2','x = '+fm(ri(-3,3))])].filter((s,i,r)=>!A.t.includes(s)&&r.indexOf(s)==i);
  qs.push({h:'Marca <b>todas</b> las asíntotas de f (si no tiene ninguna, no marques nada).',k:'c',o:shuf([...A.t,...pool.slice(0,Math.max(2,5-A.t.length))]),ans:A.t,sol:A.t.join(' ; ')||'ninguna'})}
 const OP='<option value="">— elige —</option>'+CO.map(c=>`<option>${c}</option>`).join('');
 $('fx').innerHTML=F.t;
 $('qs').innerHTML=qs.map((q,i)=>`<div class="q"><div class="ql">${i+1}. ${q.h}</div>`+(q.k=='n'?`<input id="i${i}" placeholder="número, fracción, ∞ o −∞" autocomplete="off">`:q.k=='s'?`<select id="i${i}">${OP}</select>`:q.o.map(o=>`<label class="ck"><input type="checkbox" class="c${i}" value="${o}"> ${o}</label>`).join(''))+`<div class="r" id="r${i}"></div></div>`).join('');
 $('sc').textContent='';$('cv').hidden=true;$('gr').textContent='Mostrar gráfica'}
function parse(s){s=s.trim().toLowerCase().replace(/−/g,'-').replace(/,/g,'.').replace(/infinity|inf|oo|∞/g,'Infinity').replace(/\s/g,'');
 if(/^[+-]?Infinity$/.test(s))return s[0]=='-'?-Infinity:Infinity;const m=s.match(/^([+-]?)(\d*\.?\d+|e)(?:\/(\d*\.?\d+|e))?$/);if(!m)return null;
 const t=x=>x=='e'?Math.E:parseFloat(x),v=t(m[2])/(m[3]?t(m[3]):1)*(m[1]=='-'?-1:1);return isFinite(v)?v:null}
function corregir(){let n=0;qs.forEach((q,i)=>{let ok;
 if(q.k=='n'){const v=parse($('i'+i).value);ok=v!==null&&(Math.abs(q.ans)===Infinity?v===q.ans:Math.abs(v-q.ans)<.011)}
 else if(q.k=='s')ok=$('i'+i).value==q.ans;
 else{const s=[...document.querySelectorAll('.c'+i+':checked')].map(e=>e.value).sort();ok=JSON.stringify(s)==JSON.stringify([...q.ans].sort())}
 n+=ok;const e=$('r'+i);e.className='r '+(ok?'ok':'ko');e.textContent=ok?'✓ Correcto':'✗ Solución: '+q.sol});
 $('sc').textContent=`Aciertos: ${n}/${qs.length}`}
function draw(){const c=$('cv'),g=c.getContext('2d'),W=c.width,H=c.height,S=getComputedStyle(document.documentElement),col=n=>S.getPropertyValue(n).trim();
 const P=[...F.brk,F.a],x0=Math.min(...P,-2)-5,x1=Math.max(...P,2)+7,ys=[];
 for(let i=0;i<=600;i++){const v=F.f(x0+(x1-x0)*i/600);if(isFinite(v)&&Math.abs(v)<500)ys.push(v)}
 ys.sort((p,q)=>p-q);const lo=ys[Math.floor(ys.length*.1)]??-3,hi=ys[Math.floor(ys.length*.9)]??3,sp=Math.max(hi-lo,4),y0=lo-sp*.4,y1=hi+sp*.4;
 const X=x=>(x-x0)/(x1-x0)*W,Y=y=>H-(y-y0)/(y1-y0)*H;
 g.clearRect(0,0,W,H);g.font='12px sans-serif';g.fillStyle=col('--mu');g.strokeStyle=col('--bd');g.lineWidth=1;
 const st=Math.ceil((x1-x0)/14);for(let x=Math.ceil(x0);x<x1;x++){if(x%st)continue;g.beginPath();g.moveTo(X(x),0);g.lineTo(X(x),H);g.stroke();g.fillText(x,X(x)+2,Math.min(H-4,Math.max(12,Y(0)+13)))}
 const ry=(y1-y0)/8,p10=10**Math.floor(Math.log10(ry)),ny=[1,2,5,10].find(m=>m*p10>=ry)*p10;
 for(let y=Math.ceil(y0/ny)*ny;y<y1;y+=ny){g.beginPath();g.moveTo(0,Y(y));g.lineTo(W,Y(y));g.stroke();if(Math.abs(y)>1e-9)g.fillText(+y.toFixed(2),Math.min(W-30,Math.max(3,X(0)+4)),Y(y)-3)}
 g.strokeStyle=col('--fg');g.lineWidth=1.5;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
 g.strokeStyle=col('--ko');g.lineWidth=1.5;g.setLineDash([7,5]);
 A.vs.forEach(p=>{g.beginPath();g.moveTo(X(p),0);g.lineTo(X(p),H);g.stroke()});
 A.hs.forEach(h=>{g.beginPath();g.moveTo(0,Y(h));g.lineTo(W,Y(h));g.stroke()});
 A.os.forEach(([m,n])=>{g.beginPath();g.moveTo(X(x0),Y(m*x0+n));g.lineTo(X(x1),Y(m*x1+n));g.stroke()});g.setLineDash([]);
 const cuts=[x0,...F.brk.filter(p=>p>x0&&p<x1).sort((p,q)=>p-q),x1];g.strokeStyle=col('--ac');g.lineWidth=2.4;
 for(let i=0;i<cuts.length-1;i++){const a=cuts[i]+1e-4,b=cuts[i+1]-1e-4;g.beginPath();let pen=false;
  for(let j=0;j<=500;j++){const x=a+(b-a)*j/500,v=F.f(x);if(!isFinite(v)||Math.abs(v)>1e6){pen=false;continue}pen?g.lineTo(X(x),Y(v)):g.moveTo(X(x),Y(v));pen=true}g.stroke()}
 const dot=(x,y,f)=>{if(!isFinite(y)||y<y0||y>y1)return;g.beginPath();g.arc(X(x),Y(y),4.8,0,7);g.fillStyle=f?col('--ac'):col('--card');g.fill();g.strokeStyle=col('--ac');g.lineWidth=2;g.stroke()};
 Object.entries(A.p).forEach(([p,o])=>{p=+p;[o.L,o.R].forEach(v=>{if(isFinite(v)&&!(Math.abs(v-o.fa)<.01))dot(p,v,0)});if(isFinite(o.fa))dot(p,o.fa,1)})}
$('nw').onclick=nuevo;$('ck').onclick=corregir;$('fam').onchange=nuevo;
$('gr').onclick=()=>{const c=$('cv');c.hidden=!c.hidden;$('gr').textContent=c.hidden?'Mostrar gráfica':'Ocultar gráfica';if(!c.hidden)draw()};
nuevo();
</script></body></html>
