<script>
const $=s=>document.querySelector(s);
let rnd;
function mk(s){let a=s;rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const F=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return [n/g,d/g];};
const fadd=(x,y)=>F(x[0]*y[1]+y[0]*x[1],x[1]*y[1]);
/* ---------- parser ---------- */
function parse(s){
  s=s.replace(/−/g,'-').replace(/[·×]/g,'*').replace(/√/g,'sqrt').replace(/\s+/g,'');
  const T=s.match(/\d+|sqrt|rt|[-+*\/^(),]|./g)||[];let i=0;
  const peek=()=>T[i],nx=()=>T[i++];
  const st=t=>t!==undefined&&(/^\d/.test(t)||t==='('||t==='sqrt'||t==='rt');
  const need=c=>{if(nx()!==c)throw 0;};
  function expr(){let a=term();while(peek()==='+'||peek()==='-'){const o=nx();a={t:o,a,b:term()};}return a;}
  function term(){let a=unary();for(;;){const t=peek();if(t==='*'||t==='/'){nx();a={t,a,b:unary()};}else if(st(t)){a={t:'*',a,b:unary()};}else break;}return a;}
  function unary(){if(peek()==='-'){nx();return {t:'neg',a:unary()};}if(peek()==='+'){nx();return unary();}return pow();}
  function pow(){const a=atom();if(peek()==='^'){nx();let b;if(peek()==='-'){nx();b={t:'neg',a:atom()};}else b=atom();return {t:'^',a,b};}return a;}
  function atom(){const t=nx();if(t===undefined)throw 0;
    if(/^\d+$/.test(t))return {t:'n',v:+t};
    if(t==='('){const e=expr();need(')');return e;}
    if(t==='sqrt'){need('(');const x=expr();need(')');return {t:'rt',n:{t:'n',v:2},x};}
    if(t==='rt'){need('(');const n=expr();need(',');const x=expr();need(')');return {t:'rt',n,x};}
    throw 0;}
  const r=expr();if(i<T.length)throw 0;return r;
}
/* ---------- àlgebra de monomis ---------- */
function factor(n){const e={};for(let p=2;p*p<=n;p++)while(n%p===0){e[p]=(e[p]||0)+1;n/=p;}if(n>1)e[n]=(e[n]||0)+1;return e;}
const neg=x=>x.map(m=>({s:-m.s,e:m.e}));
const mulM=(a,b)=>{const e={...a.e};for(const p in b.e)e[p]=e[p]?fadd(e[p],b.e[p]):b.e[p];return {s:a.s*b.s,e};};
const invM=m=>{const e={};for(const p in m.e)e[p]=[-m.e[p][0],m.e[p][1]];return {s:m.s,e};};
function canon(x){
  const acc=new Map();
  for(const m of x){let num=1,den=1;const key=[];
    for(const p in m.e){const [a,b]=m.e[p];if(!a)continue;const f=Math.floor(a/b),r=F(a-f*b,b);
      if(f>0)num*=Math.pow(+p,f);else if(f<0)den*=Math.pow(+p,-f);
      if(r[0])key.push([+p,r[0]+'/'+r[1]]);}
    key.sort((u,v)=>u[0]-v[0]);const k=key.map(q=>q[0]+':'+q[1]).join(',');
    if(num>9e15||den>9e15)throw new Error('big');
    acc.set(k,fadd(acc.get(k)||[0,1],F(m.s*num,den)));}
  return [...acc].filter(([k,c])=>c[0]!==0).sort((u,v)=>u[0]<v[0]?-1:1);
}
function toMono([k,[n,d]]){
  const e={},add=(p,f)=>{e[p]=e[p]?fadd(e[p],f):f;};
  const fa=factor(Math.abs(n)),fb=factor(d);
  for(const p in fa)add(p,[fa[p],1]);for(const p in fb)add(p,[-fb[p],1]);
  if(k)k.split(',').forEach(x=>{const[p,r]=x.split(':');const[a,b]=r.split('/');add(p,[+a,+b]);});
  return {s:n<0?-1:1,e};
}
function single(x){if(x.length===1)return x[0];const c=canon(x);if(c.length!==1)throw new Error('single');return toMono(c[0]);}
function constRat(x){const c=canon(x);if(!c.length)return [0,1];if(c.length===1&&c[0][0]==='')return c[0][1];throw new Error('const');}
function ev(n){
  switch(n.t){
    case 'n':if(n.v>1e9)throw new Error('big');if(n.v===0)return [];{const e={};const f=factor(n.v);for(const p in f)e[p]=[f[p],1];return [{s:1,e}];}
    case '+':return ev(n.a).concat(ev(n.b));
    case '-':return ev(n.a).concat(neg(ev(n.b)));
    case 'neg':return neg(ev(n.a));
    case '*':{const A=ev(n.a),B=ev(n.b),o=[];for(const x of A)for(const y of B)o.push(mulM(x,y));return o;}
    case '/':{const m=invM(single(ev(n.b)));return ev(n.a).map(x=>mulM(x,m));}
    case '^':{const A=ev(n.a),q=constRat(ev(n.b));
      if(canon(A).length>1){if(q[1]!==1||q[0]<0||q[0]>6)throw new Error('pow');let r=[{s:1,e:{}}];for(let i=0;i<q[0];i++){const o=[];for(const x of r)for(const y of A)o.push(mulM(x,y));r=o;}return r;}
      const m=single(A);if(q[1]!==1&&m.s<0)throw new Error('neg');
      const s=(m.s<0&&q[0]%2!==0)?-1:1,e={};for(const p in m.e){const [a,b]=m.e[p];e[p]=F(a*q[0],b*q[1]);}return [{s,e}];}
    case 'rt':{const k=constRat(ev(n.n));if(k[1]!==1||k[0]<1)throw new Error('idx');const m=single(ev(n.x));if(m.s<0)throw new Error('neg');
      const e={};for(const p in m.e){const [a,b]=m.e[p];e[p]=F(a,b*k[0]);}return [{s:1,e}];}
  }
}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* ---------- forma final ---------- */
const kids=n=>n.t==='rt'?[n.n,n.x]:n.t==='n'?[]:[n.a,n.b].filter(Boolean);
const some=(n,f)=>f(n)||kids(n).some(k=>some(k,f));
const cnt=n=>n.t==='+'||n.t==='-'?cnt(n.a)+cnt(n.b):n.t==='neg'?cnt(n.a):(n.t==='/'&&n.b.t==='n')?cnt(n.a):1;
const fracPow=n=>n.t==='^'&&!(n.b.t==='n'||(n.b.t==='neg'&&n.b.a.t==='n'));
function badForm(ast,fl,len){
  if(some(ast,fracPow))return true;
  let bad=false,rts=0;
  some(ast,n=>{
    if(n.t==='rt'){rts++;
      if(some(n.x,k=>k.t==='rt'||k.t==='/'||k.t==='^'&&k.b.t!=='n'))bad=true;
      else{try{const m=single(ev(n.x)),k=constRat(ev(n.n))[0];const v=Object.values(m.e).map(f=>f[0]);
        if(m.s<0||!v.length||v.some(x=>x<0||(!fl.top&&x>=k))||gcd(k,v.reduce(gcd,0))!==1)bad=true;}catch(e){bad=true;}}}
    if(n.t==='/'){if(some(n.b,k=>k.t==='rt'||fracPow(k)))bad=true;
      if(n.a.t==='n'&&n.b.t==='n'&&gcd(n.a.v,n.b.v)>1)bad=true;}
    return false;});
  if(fl.one&&rts>1)bad=true;
  if(fl.top&&ast.t!=='rt')bad=true;
  return bad||cnt(ast)!==len;
}
/* ---------- render ---------- */
const pr={'+':1,'-':1,'neg':2,'*':3,'/':3,'^':4};
const pc=n=>pr[n.t]||9;
const par=(n,min)=>pc(n)<min?`<mrow><mo>(</mo>${mm(n)}<mo>)</mo></mrow>`:mm(n);
function mm(n){
  switch(n.t){
    case 'n':return `<mn>${n.v}</mn>`;
    case 'rt':return n.n.t==='n'&&n.n.v===2?`<msqrt>${mm(n.x)}</msqrt>`:`<mroot><mrow>${mm(n.x)}</mrow><mrow>${mm(n.n)}</mrow></mroot>`;
    case '+':return mm(n.a)+'<mo>+</mo>'+mm(n.b);
    case '-':return mm(n.a)+'<mo>−</mo>'+par(n.b,2);
    case 'neg':return '<mo>−</mo>'+par(n.a,3);
    case '*':{const j=n.a.t==='n'&&(n.b.t==='rt'||pc(n.b)<3);return par(n.a,3)+(j?'':'<mo>·</mo>')+par(n.b,3);}
    case '/':return `<mfrac><mrow>${mm(n.a)}</mrow><mrow>${mm(n.b)}</mrow></mfrac>`;
    case '^':return `<msup>${par(n.a,9)}<mrow>${mm(n.b)}</mrow></msup>`;
  }
}
const M=s=>`<math>${mm(parse(s))}</math>`;
function canonStr(c){
  if(!c.length)return '0';
  return c.map(([k,[n,d]],i)=>{
    let t=String(Math.abs(n));
    if(k){const ps=k.split(',').map(x=>{const[p,r]=x.split(':');const[a,b]=r.split('/');return [+p,+a,+b];});
      let L=1;ps.forEach(q=>L=L/gcd(L,q[2])*q[2]);
      const rad=ps.map(([p,a,b])=>{const e=a*L/b;return e===1?p:p+'^'+e;}).join('*');
      t=(Math.abs(n)===1?'':Math.abs(n)+'*')+`rt(${L},${rad})`;}
    if(d!==1)t=`(${t})/${d}`;
    return (n<0?'-':(i?'+':''))+t;}).join('');
}

/* ---------- generadors combinats ---------- */
const P=(b,k)=>k===1?`${b}`:`${b}^${k}`;
const rs=(bs,es)=>bs.map((b,i)=>es[i]>0?P(b,es[i]):'').filter(Boolean).join('*');
const co=c=>c===1?'':c+'*';
const sg=s=>s>0?'+':'-';
const G={
 g1(v){const n0=R(3,4),g=R(2,3),bs=shuf([2,3,5]).slice(0,v?2:1);let q,r;do{q=bs.map(()=>R(0,2));r=bs.map(()=>R(1,n0-1));}while(!q.some(x=>x>0));
  return {t:'Simplifica i extrau tots els factors possibles:',p:`rt(${n0*g},${rs(bs,bs.map((_,i)=>g*(q[i]*n0+r[i])))})`};},
 g2(v){const d=pick([2,3,5,6,7]),c1=R(1,4),c3=R(1,3),k=R(1,3),t1=R(2,4),t3=R(2,3),s2=pick([1,-1]),s3=pick([1,-1]);
  if(!v)return {t:'Calcula i simplifica:',p:`${co(c1)}sqrt(${t1*t1*d})${sg(s2)}${d*k}/sqrt(${d})${sg(s3)}${co(c3)}sqrt(${t3*t3*d})`};
  const b=pick([2,3]),r=R(1,2);
  return {t:'Calcula i simplifica:',p:`${co(c1)}rt(3,${b**r*t1**3})${sg(s2)}${b*k}/rt(3,${b**(3-r)})${sg(s3)}${co(c3)}rt(3,${b**r*t3**3})`};},
 g3(v){const [n1,n2]=pick([[2,3],[3,4],[2,4],[3,6]]),bs=shuf([2,3,5]);
  const a=`rt(${n1},${rs(bs.slice(0,2),[R(1,3),R(1,2)])})`,b=`rt(${n2},${rs([bs[0],bs[2]],[R(1,3),R(1,2)])})`;
  return {t:v?'Efectua i simplifica (sense arrels al denominador):':'Efectua i simplifica:',p:v?`(${a})/(${b})`:`${a}*${b}`};},
 g4(v){const A=P(2,R(1,5))+(R(0,1)?'*'+P(3,R(1,3)):''),B=P(2,R(1,7))+(R(0,1)?'*'+P(5,R(1,3)):'');
  if(!v)return {t:'Escriu com un sol radical i extrau factors:',p:`rt(${R(2,3)},${eval(A.replace(/\^/g,'**'))}*rt(${R(2,3)},${eval(B.replace(/\^/g,'**'))}))`};
  const [c1,c2,c3]=shuf([2,3,5,6]);return {t:'Escriu com un sol radical i extrau factors:',p:`rt(${R(2,3)},${c1}*rt(${R(2,3)},${P(c2,R(2,4))}*rt(${R(2,3)},${P(c3,R(2,4))})))`};},
 g5(v){const d=pick([2,3,5,7]);
  if(!v){const t3=R(1,3),t2=t3+R(1,3),d1=pick([2,3,5,7].filter(x=>x!==d)),t1=R(1,3);
    return {t:'Racionalitza i simplifica:',p:`${co(R(1,6))}sqrt(${t1*t1*d1})/(sqrt(${t2*t2*d})-sqrt(${t3*t3*d}))`};}
  for(;;){const t=R(2,3),p=R(2,9),q=R(1,2),sgn=pick([1,-1]),N=p*p-q*q*t*t*d;if(!N||Math.abs(N)>20)continue;
    const num=`${R(1,5)}+${co(R(1,3))}sqrt(${t*t*d})`,den=`${p}${sg(sgn)}${co(q)}sqrt(${t*t*d})`,cj=`${p}${sg(-sgn)}${co(q*t)}sqrt(${d})`;
    return {t:'Racionalitza i simplifica:',p:`(${num})/(${den})`,e:`(${num})*(${cj})/(${p}^2-${q*q*t*t*d})`};}},
 g6(v){const p=R(1,4),q=R(1,3),d=pick([2,3,5,7]);
  return v?{t:'Calcula:',p:`((${p}+sqrt(${d}))^2-(${p}-sqrt(${d}))^2)/sqrt(${d})`}:{t:'Desenvolupa i racionalitza:',p:`(${p}+${co(q)}sqrt(${d}))^2/sqrt(${d})`};}
};
const EX=[
 ['Simplificació i extracció','1,5',[['g1',0],['g1',1]]],
 ['Suma i resta amb extracció i racionalització','2',[['g2',0],['g2',1]]],
 ['Producte i quocient amb índex diferent','1,5',[['g3',0],['g3',1]]],
 ['Radicals aniuats','1,5',[['g4',0],['g4',1]]],
 ['Racionalització avançada','2',[['g5',0],['g5',1]]],
 ['Expressions combinades','1,5',[['g6',0],['g6',1]]]
];
function safe(f){for(let i=0;i<80;i++){const g=f();try{const e=canon(ev(parse(g.e||g.p)));if(e.length&&e.every(([k,[n,d]])=>Math.abs(n)<=2000&&d<=200)){g.ex=e;return g;}}catch(err){}}throw new Error('gen');}
function build(seed){
  mk(seed);
  const ex=EX.map(([h,p,its])=>[h,p,its.map(([g,v])=>safe(()=>G[g](v)))]);
  const L='abc';
  $('#exbody').innerHTML=ex.map(([h,p,its],i)=>`<section class="ex"><h2>${i+1}. ${h} <small>(${p} punts)</small></h2>${its.map((x,j)=>`<div class="it"><b>${L[j]})</b><span class="t">${x.t}</span>${M(x.p)}</div><div class="work"></div>`).join('')}</section>`).join('');
  $('#solbody').innerHTML=ex.map(([h,p,its],i)=>`<section class="ex"><h2>${i+1}. ${h}</h2>${its.map((x,j)=>`<div class="it"><b>${L[j]})</b>${M(canonStr(x.ex))}</div>`).join('')}</section>`).join('');
  const t=`Model ${seed}`;
  $('#model1').textContent=t;$('#model2').textContent=t;$('#code').value=seed;
}
function view(s){$('#exam').hidden=s;$('#sols').hidden=!s;$('#v-e').setAttribute('aria-pressed',!s);$('#v-s').setAttribute('aria-pressed',s);}
$('#new').onclick=()=>{build(R0());view(false);};
