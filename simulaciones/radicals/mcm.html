<style>
:root{
  --paper:#fbfcff; --grid:#dbe3f5; --ink:#1c3fb7; --text:#1f2430; --muted:#5b6478; --box:#fff7d6; --boxline:#d9b92e; --ok:#12733a; --okbg:#e0f5e8; --warn:#8a5a00; --warnbg:#fff1d1; --bad:#a42222; --badbg:#fde4e4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#14182a; --grid:#222a45; --ink:#8fa8ff; --text:#e6e9f5; --muted:#9aa3bd; --box:#2a2610; --boxline:#a98f1c; --ok:#7fe0a5; --okbg:#12301f; --warn:#f0c870; --warnbg:#35290b; --bad:#ff9a9a; --badbg:#3a1616;}
}
:root[data-theme="dark"]{--paper:#14182a; --grid:#222a45; --ink:#8fa8ff; --text:#e6e9f5; --muted:#9aa3bd; --box:#2a2610; --boxline:#a98f1c; --ok:#7fe0a5; --okbg:#12301f; --warn:#f0c870; --warnbg:#35290b; --bad:#ff9a9a; --badbg:#3a1616;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--text);font:18px/1.6 Georgia,"Times New Roman",serif}
main{max-width:40rem;margin:0 auto;padding:2rem 1.25rem 4rem}
h1{font-size:1.9rem;margin:0;color:var(--ink)}
.sub{color:var(--muted);margin:.4rem 0 1.4rem}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.2rem;font:15px/1.3 system-ui,sans-serif}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;color:var(--ink);padding:.55rem .9rem;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--boxline);outline-offset:2px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:1.2rem 1.2rem 1.4rem}
.q{font:15px/1.4 system-ui,sans-serif;color:var(--muted);margin:0 0 .6rem}
.prob{font-size:2rem;overflow-x:auto;padding:.3rem 0}
math{color:var(--ink);font-size:1.3em}
.ans{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;margin:1rem 0 .4rem;font:16px/1.3 system-ui,sans-serif}
.ans span{color:var(--muted)}
input{width:4.2rem;padding:.5rem;font:20px/1 system-ui,sans-serif;border:2px solid var(--grid);border-radius:6px;background:var(--paper);color:var(--text);text-align:center}
.act{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;font:16px/1.3 system-ui,sans-serif}
.act button{padding:.6rem 1rem;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;font:inherit}
.act .main{background:var(--ink);color:var(--paper);font-weight:600}
.fb{margin-top:1rem;padding:.7rem 1rem;border-radius:8px;font:16px/1.45 system-ui,sans-serif;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok)}
.fb.warn{display:block;background:var(--warnbg);color:var(--warn)}
.fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.sol{margin-top:1rem;background:var(--box);border:2px solid var(--boxline);border-radius:8px;padding:.5rem 1rem;overflow-x:auto;display:none}
.sol.on{display:block}
.sol p{margin:.3rem 0;font-size:16px}

@font-face{font-family:"LM Math Web";src:url("fonts/lm-math-subset.woff") format("woff");font-display:swap}
math{font-family:"LM Math Web","Latin Modern Math","STIX Two Math","Cambria Math",math,serif}
.pnav{position:sticky;top:0;z-index:30;display:flex;gap:.25rem;overflow-x:auto;white-space:nowrap;padding:.5rem .75rem;background:var(--paper);border-bottom:1.5px solid var(--ink);font:14px/1.2 system-ui,sans-serif;-webkit-overflow-scrolling:touch}
.pnav a{color:var(--ink);text-decoration:none;padding:.4rem .6rem;border-radius:6px;flex:0 0 auto}
.pnav a[aria-current="page"]{background:var(--ink);color:var(--paper);font-weight:600}
.pnav a:hover{text-decoration:underline}
.pnav .out{margin-left:auto;border:1px solid var(--ink)}
@media print{.pnav{display:none!important}}
@media (max-width:640px){.it{flex-wrap:wrap}.it .t{flex:1 1 100%}}

<body>
<nav class="pnav" aria-label="Navegació del projecte"><a href="index.html">Inici</a><a href="apunts.html">Apunts</a><a href="simplificacio.html">1 Simplificació</a><a href="extraccio.html">2 Extracció</a><a href="suma-resta.html">3 Suma i resta</a><a href="mcm.html" aria-current="page">4 Producte i quocient</a><a href="aniuats.html">5 Aniuats</a><a href="racionalitzacio.html">6 Racionalització</a><a href="nivell3.html">Nivell 3</a><a href="examen.html">Examen</a><a href="examen-avancat.html">Examen avançat</a><a class="out" href="../index.html">← Totes les simulacions</a></nav>

<main>
<h1>Producte i quocient de radicals</h1>
<p class="sub">Si els índexs són diferents, els passem al m.c.m. dels índexs abans d’operar.</p>

<div class="bar">
  <div class="seg" role="group" aria-label="Operació">
    <button id="m-m" aria-pressed="true">Multiplicar</button>
    <button id="m-d" aria-pressed="false">Dividir</button>
  </div>
  <div class="seg" role="group" aria-label="Nivell">
    <button id="l-1" aria-pressed="true">Nivell 1</button>
    <button id="l-2" aria-pressed="false">Nivell 2</button>
  </div>
</div>

<p style="margin:-.4rem 0 1.2rem;font:600 15px/1.3 system-ui,sans-serif"><a href="nivell3.html#mcm" style="display:inline-block;padding:.55rem .9rem;border:1.5px dashed var(--ink);border-radius:8px;color:var(--ink);text-decoration:none">Nivell 3 · repte sense pistes ↗</a></p>

<div class="card">
  <p class="q" id="q"></p>
  <div class="prob" id="prob" aria-live="polite"></div>
  <div class="ans" id="ans"></div>
  <div class="act">
    <button class="main" id="check">Comprova</button>
    <button id="show">Mostra la solució</button>
    <button id="next">Nou exercici</button>
  </div>
  <div class="fb" id="fb" role="status"></div>
  <div class="sol" id="sol"></div>
</div>
<p class="score" id="score"></p>
</main>

<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
const M=x=>`<math>${x}</math>`;
const mn=x=>`<mn>${x}</mn>`;
const pw=(b,e)=>e===1?mn(b):`<msup>${mn(b)}${mn(e)}</msup>`;
const root=(inner,n)=>n===2?`<msqrt>${inner}</msqrt>`:`<mroot><mrow>${inner}</mrow>${mn(n)}</mroot>`;
const st={mode:'m',lvl:1,ok:0,tot:0,cur:null,answered:false};

function gen(){
  const bs=[2,3,5,7].sort(()=>Math.random()-.5).slice(0,2);
  let n1,n2;
  if(st.lvl===1){
    const n=R(2,5), f=[2,3][R(0,1)];
    if(Math.random()<.2){n1=n2=n;} else {n1=n;n2=n*f; if(Math.random()<.5)[n1,n2]=[n2,n1];}
  }else{
    [n1,n2]=[[2,3],[3,4],[4,6],[2,5],[3,5],[4,5],[6,8],[4,10]][R(0,7)];
    if(Math.random()<.5)[n1,n2]=[n2,n1];
  }
  const L=lcm(n1,n2);
  return {a:bs[0],b:bs[1],n1,n2,L,p:L/n1,q:L/n2};
}
function render(){
  const c=st.cur; st.answered=false;
  $('#fb').className='fb'; $('#sol').className='sol'; $('#sol').innerHTML='';
  const A=root(mn(c.a),c.n1), B=root(mn(c.b),c.n2);
  $('#q').textContent=(st.mode==='m'?'Multiplica':'Divideix')+' els radicals i escriu el resultat com un únic radical: índex, exponent de '+c.a+' i exponent de '+c.b+'.';
  $('#prob').innerHTML=M(st.mode==='m'?A+'<mo>·</mo>'+B:`<mfrac>${A}${B}</mfrac>`);
  $('#ans').innerHTML=`<span>índex</span><input id="i" inputmode="numeric" aria-label="Índex comú"><span>exponent de ${c.a}</span><input id="p" inputmode="numeric" aria-label="Exponent de ${c.a}"><span>exponent de ${c.b}</span><input id="q2" inputmode="numeric" aria-label="Exponent de ${c.b}">`;
  $('#i').focus();
}
function solution(){
  const c=st.cur;
  const mid=st.mode==='m'
    ?root(pw(c.a,c.p),c.L)+'<mo>·</mo>'+root(pw(c.b,c.q),c.L)
    :`<mfrac>${root(pw(c.a,c.p),c.L)}${root(pw(c.b,c.q),c.L)}</mfrac>`;
  const fin=st.mode==='m'
    ?root(pw(c.a,c.p)+'<mo>·</mo>'+pw(c.b,c.q),c.L)
    :root(`<mfrac>${pw(c.a,c.p)}${pw(c.b,c.q)}</mfrac>`,c.L);
  const start=st.mode==='m'
    ?root(mn(c.a),c.n1)+'<mo>·</mo>'+root(mn(c.b),c.n2)
    :`<mfrac>${root(mn(c.a),c.n1)}${root(mn(c.b),c.n2)}</mfrac>`;
  return `<p>m.c.m.(${c.n1}, ${c.n2}) = ${c.L}</p>`
    +`<p>L’índex ${c.n1} es multiplica per ${c.p} i l’índex ${c.n2} per ${c.q}; els exponents, també.</p>`
    +M(start+'<mo>=</mo>'+mid+'<mo>=</mo>'+fin);
}
function fb(cls,txt){const f=$('#fb');f.className='fb '+cls;f.textContent=txt;}
function check(){
  const c=st.cur, i=parseInt($('#i').value,10), p=parseInt($('#p').value,10), q=parseInt($('#q2').value,10);
  if([i,p,q].some(isNaN)){fb('warn','Omple tots els camps abans de comprovar.');return;}
  let res;
  if(i===c.L&&p===c.p&&q===c.q)res='ok';
  else if(i>0&&i%c.L===0&&p===i/c.n1&&q===i/c.n2)res='part';
  else res='bad';
  if(res!=='part'&&!st.answered){st.tot++;if(res==='ok')st.ok++;st.answered=true;}
  if(res==='ok'){fb('ok','Correcte!');$('#sol').innerHTML=solution();$('#sol').className='sol on';}
  else if(res==='part')fb('warn','Està ben, però has fet servir un índex comú més gran que el m.c.m. El resultat es pot simplificar: busca el m.c.m. dels índexs.');
  else if(i!==c.L)fb('bad',`L’índex comú ha de ser el m.c.m. de ${c.n1} i ${c.n2}. Calcula’l primer.`);
  else fb('bad',`Per quin nombre has multiplicat cada índex per arribar a ${c.L}? Multiplica l’exponent del radicand pel mateix nombre.`);
  score();
}
function score(){$('#score').textContent=`Encerts: ${st.ok} de ${st.tot}`;}
function setMode(m){st.mode=m;$('#m-m').setAttribute('aria-pressed',m==='m');$('#m-d').setAttribute('aria-pressed',m==='d');next();}
function setLvl(l){st.lvl=l;$('#l-1').setAttribute('aria-pressed',l===1);$('#l-2').setAttribute('aria-pressed',l===2);next();}
function next(){st.cur=gen();render();}
$('#m-m').onclick=()=>setMode('m');$('#m-d').onclick=()=>setMode('d');
$('#l-1').onclick=()=>setLvl(1);$('#l-2').onclick=()=>setLvl(2);
$('#check').onclick=check;$('#next').onclick=next;
$('#show').onclick=()=>{$('#sol').innerHTML=solution();$('#sol').className='sol on';};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')check();});
score();next();
</script>
<script>(function(){function fix(r){var l=r.querySelectorAll?r.querySelectorAll('mo'):[];Array.prototype.forEach.call(l,function(m){var t=m.textContent.trim();if(t==='(')m.setAttribute('form','prefix');else if(t===')')m.setAttribute('form','postfix');});}fix(document);new MutationObserver(function(ms){ms.forEach(function(m){Array.prototype.forEach.call(m.addedNodes,function(n){if(n.nodeType===1)fix(n);});});}).observe(document.body,{childList:true,subtree:true});})();</script>
</body>
