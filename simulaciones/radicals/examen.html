<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radicals · Generador d’exàmens</title>
<style>
:root{
  --paper:#fbfcff; --ink:#1c3fb7; --text:#1f2430; --muted:#5b6478; --line:#c9d3ee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#14182a; --ink:#8fa8ff; --text:#e6e9f5; --muted:#9aa3bd; --line:#2d3658;}
}
:root[data-theme="dark"]{--paper:#14182a; --ink:#8fa8ff; --text:#e6e9f5; --muted:#9aa3bd; --line:#2d3658;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.4rem;font:15px/1.3 system-ui,sans-serif}
.tools button,.tools input{font:inherit;padding:.55rem .9rem;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.tools .main{background:var(--ink);color:var(--paper);font-weight:600}
.tools input{width:6rem;color:var(--text);cursor:text;text-align:center}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid #d9b92e;outline-offset:2px}
h1{font-size:1.5rem;margin:0 0 .3rem;color:var(--ink)}
.head{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;border-bottom:2px solid var(--ink);padding-bottom:.6rem;margin-bottom:1rem;font:15px/1.4 system-ui,sans-serif}
.head span{flex:1 1 12rem;border-bottom:1px solid var(--line);min-height:1.8rem}
.model{color:var(--muted);font:14px/1.3 system-ui,sans-serif;margin:0 0 1rem}
.ex{margin:0 0 1.4rem;break-inside:avoid}
.ex h2{font-size:1.05rem;margin:0 0 .4rem;color:var(--ink)}
.ex h2 small{font:600 13px system-ui,sans-serif;color:var(--muted)}
.it{display:flex;gap:.6rem;align-items:center;margin:.35rem 0;padding:.35rem 0;overflow-x:auto}
.it b{min-width:1.4rem}
.it .t{font:14px/1.3 system-ui,sans-serif;color:var(--muted);flex:0 0 auto}
.work{height:5.5rem}
math{font-size:1.25em;color:var(--ink)}
.sol .it{border-bottom:1px dashed var(--line)}
@media print{
  :root{--paper:#fff;--ink:#000;--text:#000;--muted:#333;--line:#999}
  .noprint{display:none!important}
  body{font-size:13pt}
  main{max-width:none;padding:0}
  .work{height:4.2rem}
}

@font-face{font-family:"LM Math Web";src:url("fonts/lm-math-subset.woff") format("woff");font-display:swap}
math{font-family:"LM Math Web","Latin Modern Math","STIX Two Math","Cambria Math",math,serif}
.pnav{position:sticky;top:0;z-index:30;display:flex;gap:.25rem;overflow-x:auto;white-space:nowrap;padding:.5rem .75rem;background:var(--paper);border-bottom:1.5px solid var(--ink);font:14px/1.2 system-ui,sans-serif;-webkit-overflow-scrolling:touch}
.pnav a{color:var(--ink);text-decoration:none;padding:.4rem .6rem;border-radius:6px;flex:0 0 auto}
.pnav a[aria-current="page"]{background:var(--ink);color:var(--paper);font-weight:600}
.pnav a:hover{text-decoration:underline}
.pnav .out{margin-left:auto;border:1px solid var(--ink)}
@media print{.pnav{display:none!important}}
@media (max-width:640px){.it{flex-wrap:wrap}.it .t{flex:1 1 100%}}
</style>
</head>
<body>
<nav class="pnav" aria-label="Navegació del projecte"><a href="index.html">Inici</a><a href="apunts.html">Apunts</a><a href="simplificacio.html">1 Simplificació</a><a href="extraccio.html">2 Extracció</a><a href="suma-resta.html">3 Suma i resta</a><a href="mcm.html">4 Producte i quocient</a><a href="aniuats.html">5 Aniuats</a><a href="racionalitzacio.html">6 Racionalització</a><a href="nivell3.html">Nivell 3</a><a href="examen.html" aria-current="page">Examen</a><a href="examen-avancat.html">Examen avançat</a><a class="out" href="../index.html">← Totes les simulacions</a></nav>

<main>
<div class="tools noprint">
  <button class="main" id="new">Examen nou</button>
  <label>Codi <input id="code" inputmode="numeric" aria-label="Codi del model"></label>
  <button id="load">Carrega</button>
  <div class="seg" role="group" aria-label="Vista">
    <button id="v-e" aria-pressed="true">Examen</button>
    <button id="v-s" aria-pressed="false">Solucions</button>
  </div>
  <button id="pdfe">Descarrega l’examen (PDF)</button>
  <button id="pdfs">Descarrega les solucions (PDF)</button>
</div>

<div id="exam">
  <h1>Examen de radicals · 4t ESO</h1>
  <div class="head"><span>Nom:</span><span>Grup:</span><span>Data:</span><span>Nota:</span></div>
  <p class="model" id="model1"></p>
  <div id="exbody"></div>
</div>
<div id="sols" hidden>
  <h1>Solucions · Examen de radicals</h1>
  <p class="model" id="model2"></p>
  <div id="solbody" class="sol"></div>
</div>
</main>

<script src="lib/pdf-lib.min.js"></script>
<script src="pdf-math.js"></script>
<script>
const $=s=>document.querySelector(s);
let rnd;
function mk(s){let a=s;rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
const M=x=>`<math>${x}</math>`;
const mn=x=>`<mn>${x}</mn>`;
const pw=(b,e)=>e===1?mn(b):`<msup>${mn(b)}${mn(e)}</msup>`;
const root=(i,n)=>n===2?`<msqrt>${i}</msqrt>`:`<mroot><mrow>${i}</mrow>${mn(n)}</mroot>`;
const sq=d=>`<msqrt>${mn(d)}</msqrt>`;
const fr=(a,b)=>`<mfrac><mrow>${a}</mrow><mrow>${b}</mrow></mfrac>`;
const coef=c=>c===1?'':mn(c);
const op=s=>`<mo>${s>0?'+':'−'}</mo>`;
const dot='<mo>·</mo>', eq='<mo>=</mo>';
const pr=(bs,es)=>bs.map((b,i)=>[b,es[i]]).filter(x=>x[1]>0).map(([b,e])=>pw(b,e)).join(dot);
const cop=()=>coprime();
function coprime(lo,hi){let n,m;do{n=R(lo,hi);m=R(1,n-1);}while(gcd(m,n)!==1);return [m,n];}

const G={
 s1(){const a=pick([2,3,5,7]),[m,n]=coprime(2,6),g=R(2,4);return {t:'Simplifica:',s:root(pw(a,m*g),n*g),a:root(pw(a,m),n)};},
 a1(){const a=pick([2,3,5,7]),[m,n]=coprime(2,5),k=R(2,5);return {t:'Escriu amb l’índex indicat:',s:root(pw(a,m),n)+eq+root('<mtext>□</mtext>',n*k),a:root(pw(a,m*k),n*k)};},
 x2(){const bs=shuf([2,3,5]).slice(0,R(2,3)),n=R(3,5);let es;do{es=bs.map(()=>R(1,3*n));}while(!(es.some(e=>e>=n)&&es.some(e=>e%n>0)));
  const q=es.map(e=>Math.floor(e/n)),r=es.map(e=>e%n),o=pr(bs,q);return {t:'Extrau tots els factors possibles:',s:root(pr(bs,es),n),a:(o?o+dot:'')+root(pr(bs,r),n)};},
 i2(){const bs=shuf([2,3]).slice(0,R(1,2)+0),n=R(3,5);let q,r;do{q=bs.map(()=>R(0,2));r=bs.map(()=>R(0,n-1));}while(!(q.some(x=>x>0)&&r.some(x=>x>0)&&bs.every((_,i)=>q[i]+r[i]>0)));
  return {t:'Introdueix tots els factors dins de l’arrel:',s:pr(bs,q)+dot+root(pr(bs,r),n),a:root(pr(bs,bs.map((_,i)=>q[i]*n+r[i])),n)};},
 s3(){const b=pick([2,3,5,7]),n=R(2,4),c2=R(1,5),s=pick([1,-1]);let c1=R(1,6);if(s<0&&c1<=c2)c1=c2+R(1,4);
  return {t:'Calcula:',s:coef(c1)+root(mn(b),n)+op(s)+coef(c2)+root(mn(b),n),a:coef(c1+s*c2)+root(mn(b),n)};},
 e3(){const b=pick([2,3]),n=R(3,4),r=R(1,n-1),k=R(1,2),e=r+k*n,c2=R(1,3),m=c2*b**k,s=pick([1,-1]);let c1=R(1,5);if(s<0&&c1<=m)c1=m+R(1,4);
  return {t:'Calcula (primer extrau factors):',s:coef(c1)+root(mn(b**r),n)+op(s)+coef(c2)+root(pw(b,e),n),a:coef(c1+s*m)+root(mn(b**r),n)};},
 p4(d){const [n1,n2]=pick([[5,10],[3,6],[2,4],[4,6],[2,3],[3,4],[6,10]]),[a,b]=shuf([2,3,5,7]),L=lcm(n1,n2),p=L/n1,q=L/n2;
  const A=root(mn(a),n1),B=root(mn(b),n2);
  return d?{t:'Divideix i expressa-ho com un sol radical:',s:fr(A,B),a:root(fr(pw(a,p),pw(b,q)),L)}:{t:'Multiplica i expressa-ho com un sol radical:',s:A+dot+B,a:root(pw(a,p)+dot+pw(b,q),L)};},
 n5(){const [a]=shuf([2,3,5,7]),n=R(2,4),m=R(2,4);return {t:'Expressa com un sol radical:',s:root(root(mn(a),m),n),a:root(mn(a),n*m)};},
 f5(){const [a,c]=shuf([2,3,5,7]),n=R(2,4),m=R(2,4);let k;do{k=R(1,3);}while(gcd(m,k)!==1);
  return {t:'Expressa com un sol radical:',s:root(mn(c)+dot+root(pw(a,k),m),n),a:root(pw(c,m)+dot+pw(a,k),n*m)};},
 A6(){let d,k,c;do{d=pick([2,3,5,6,7,10]);k=R(1,3);c=R(1,9);}while(gcd(c,k*d)!==1);return {t:'Racionalitza:',s:fr(mn(c),coef(k)+sq(d)),a:fr(mn(c)+sq(d),mn(k*d))};},
 B6(){let n,a,p,c;do{n=R(3,5);a=pick([2,3,5]);p=R(1,n-1);c=R(1,9);}while(gcd(n,p)!==1||gcd(c,a)!==1);
  return {t:'Racionalitza:',s:fr(mn(c),root(pw(a,p),n)),a:fr(mn(c)+root(pw(a,n-p),n),mn(a))};},
 C6(){let a,d,D,c,s;do{a=R(2,5);d=pick([2,3,5,6,7,10,11,13,14,15]);D=a*a-d;c=R(1,9);s=pick([1,-1]);}while(D<1||gcd(c,D)!==1);
  const num=mn(c*a)+op(-s)+coef(c)+sq(d);return {t:'Racionalitza:',s:fr(mn(c),mn(a)+op(s)+sq(d)),a:D===1?num:fr(num,mn(D))};}
};
const EX=[
 ['Simplificació de radicals','1,5',['s1','a1']],
 ['Extracció i introducció de factors','2',['x2','i2']],
 ['Suma i resta de radicals','1,5',['s3','e3']],
 ['Producte i quocient amb índex diferent','1,5',['p4m','p4d']],
 ['Radicals aniuats','1,5',['n5','f5']],
 ['Racionalització','2',['A6','B6','C6']]
];
function build(seed){
  mk(seed);
  const ex=EX.map(([h,p,ids])=>[h,p,ids.map(id=>id==='p4m'?G.p4(0):id==='p4d'?G.p4(1):G[id]())]);
  const L='abc';
  $('#exbody').innerHTML=ex.map(([h,p,its],i)=>`<section class="ex"><h2>${i+1}. ${h} <small>(${p} punts)</small></h2>${its.map((x,j)=>`<div class="it"><b>${L[j]})</b><span class="t">${x.t}</span>${M(x.s)}</div><div class="work"></div>`).join('')}</section>`).join('');
  $('#solbody').innerHTML=ex.map(([h,p,its],i)=>`<section class="ex"><h2>${i+1}. ${h}</h2>${its.map((x,j)=>`<div class="it"><b>${L[j]})</b>${M(x.s+eq+x.a)}</div>`).join('')}</section>`).join('');
  const t=`Model ${seed}`;
  $('#model1').textContent=t;$('#model2').textContent=t;$('#code').value=seed;
}
function view(s){$('#exam').hidden=s;$('#sols').hidden=!s;$('#v-e').setAttribute('aria-pressed',!s);$('#v-s').setAttribute('aria-pressed',s);}
$('#new').onclick=()=>{build(R0());view(false);};
function R0(){return Math.floor(Math.random()*9000)+1000;}
$('#load').onclick=()=>{const v=parseInt($('#code').value,10);if(v>0)build(v);};
$('#v-e').onclick=()=>view(false);$('#v-s').onclick=()=>view(true);
$('#pdfe').onclick=()=>downloadPdf('exam');$('#pdfs').onclick=()=>downloadPdf('sol');
build(R0());
</script>
<script>(function(){function fix(r){var l=r.querySelectorAll?r.querySelectorAll('mo'):[];Array.prototype.forEach.call(l,function(m){var t=m.textContent.trim();if(t==='(')m.setAttribute('form','prefix');else if(t===')')m.setAttribute('form','postfix');});}fix(document);new MutationObserver(function(ms){ms.forEach(function(m){Array.prototype.forEach.call(m.addedNodes,function(n){if(n.nodeType===1)fix(n);});});}).observe(document.body,{childList:true,subtree:true});})();</script>
</body>
</html>
