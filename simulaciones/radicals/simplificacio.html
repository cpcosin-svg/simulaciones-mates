<main>
<h1>Simplificació de radicals</h1>
<p class="sub">Practica amb la propietat de les fraccions equivalents: ⁿ√(aᵐ) = a<sup>m/n</sup>.</p>

<div class="bar">
  <div class="seg" role="group" aria-label="Tipus d’exercici">
    <button id="m-s" aria-pressed="true">Simplificar</button>
    <button id="m-a" aria-pressed="false">Ampliar</button>
  </div>
  <div class="seg" role="group" aria-label="Nivell">
    <button id="l-1" aria-pressed="true">Nivell 1</button>
    <button id="l-2" aria-pressed="false">Nivell 2</button>
  </div>
</div>

<p style="margin:-.4rem 0 1.2rem;font:600 15px/1.3 system-ui,sans-serif"><a href="nivell3.html#simplificacio" style="display:inline-block;padding:.55rem .9rem;border:1.5px dashed var(--ink);border-radius:8px;color:var(--ink);text-decoration:none">Nivell 3 · repte sense pistes ↗</a></p>

<div class="card">
  <p class="q" id="q"></p>
  <div class="prob" id="prob" aria-live="polite"></div>
  <div class="ans" id="ans"></div>
  <div class="act">
    <button class="main" id="check">Comprova</button>
    <button id="show">Mostra la solució</button>
    <button id="next">Nou exercici</button>
  </div>
  <div class="fb" id="fb" role="status"></div>
  <div class="sol" id="sol"></div>
</div>
<p class="score" id="score"></p>
</main>

<script>
const $=s=>document.querySelector(s);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const bases=[2,3,5,7];
const st={mode:'s',lvl:1,ok:0,tot:0,cur:null,answered:false};

function rad(a,m,n){
  const p=m===1?`<mn>${a}</mn>`:`<msup><mn>${a}</mn><mn>${m}</mn></msup>`;
  return n===2?`<msqrt>${p}</msqrt>`:`<mroot>${p}<mn>${n}</mn></mroot>`;
}
function pw(a,m,n){return `<msup><mn>${a}</mn><mfrac><mn>${m}</mn><mn>${n}</mn></mfrac></msup>`;}
const M=x=>`<math>${x}</math>`;

function coprimePair(maxN){
  while(true){const n=R(2,maxN),m=R(1,n-1); if(gcd(m,n)===1) return [m,n];}
}
function gen(){
  const a=bases[R(0,3)];
  if(st.mode==='s'){
    const [m0,n0]=coprimePair(st.lvl===1?4:6);
    const g=st.lvl===1?R(2,3):R(2,5);
    return {a,m:m0*g,n:n0*g,m0,n0,g};
  }
  const [m0,n0]=coprimePair(st.lvl===1?4:5);
  const k=st.lvl===1?R(2,4):R(3,7);
  return {a,m0,n0,k,N:n0*k,M:m0*k};
}
function render(){
  const c=st.cur; st.answered=false;
  $('#fb').className='fb'; $('#sol').className='sol'; $('#sol').innerHTML='';
  if(st.mode==='s'){
    $('#q').textContent='Simplifica el radical: escriu l’exponent i l’índex del radical més simple.';
    $('#prob').innerHTML=M(rad(c.a,c.m,c.n));
    $('#ans').innerHTML=`${M('<mn>'+c.a+'</mn>')}<span>exponent</span><label><input id="i1" inputmode="numeric" aria-label="Exponent del radicand"></label><span>índex</span><label><input id="i2" inputmode="numeric" aria-label="Índex del radical"></label>`;
  }else{
    $('#q').textContent=`Escriu el radical amb índex ${c.N}: quin exponent ha de tenir el radicand?`;
    $('#prob').innerHTML=M(rad(c.a,c.m0,c.n0)+'<mo>=</mo><mroot><msup><mn>'+c.a+'</mn><mo>?</mo></msup><mn>'+c.N+'</mn></mroot>');
    $('#ans').innerHTML=`<span>exponent</span><label><input id="i1" inputmode="numeric" aria-label="Exponent del radicand"></label>`;
  }
  $('#i1').focus();
}
function solution(){
  const c=st.cur;
  if(st.mode==='s')
    return M(rad(c.a,c.m,c.n)+'<mo>=</mo>'+pw(c.a,c.m,c.n)+'<mo>=</mo>'+pw(c.a,c.m0,c.n0)+'<mo>=</mo>'+rad(c.a,c.m0,c.n0))+`<p>Dividim exponent i índex entre ${c.g}: ${c.m}/${c.n} = ${c.m0}/${c.n0}.</p>`;
  return M(rad(c.a,c.m0,c.n0)+'<mo>=</mo>'+pw(c.a,c.m0,c.n0)+'<mo>=</mo>'+pw(c.a,c.M,c.N)+'<mo>=</mo>'+rad(c.a,c.M,c.N))+`<p>Multipliquem exponent i índex per ${c.k}: ${c.m0}/${c.n0} = ${c.M}/${c.N}.</p>`;
}
function fb(cls,txt){const f=$('#fb');f.className='fb '+cls;f.textContent=txt;}
function check(){
  const c=st.cur, v1=parseInt($('#i1').value,10), el2=$('#i2'), v2=el2?parseInt(el2.value,10):null;
  if(isNaN(v1)||(el2&&isNaN(v2))){fb('warn','Omple tots els camps abans de comprovar.');return;}
  let res;
  if(st.mode==='s'){
    if(v1===c.m0&&v2===c.n0) res='ok';
    else if(v2>0&&v1*c.n===c.m*v2) res='part';
    else res='bad';
  }else res=(v1===c.M)?'ok':'bad';
  if(res!=='part'&&!st.answered){st.tot++; if(res==='ok')st.ok++; st.answered=true;}
  if(res==='ok'){fb('ok','Correcte!');$('#sol').innerHTML=solution();$('#sol').className='sol on';}
  else if(res==='part'){fb('warn','Està ben, però encara es pot simplificar més. Busca un altre nombre que divideixi exponent i índex.');}
  else if(st.mode==='s')fb('bad',`No és equivalent. Fixa’t en la fracció ${c.m}/${c.n}: per quin nombre pots dividir numerador i denominador?`);
  else fb('bad',`No és equivalent. Per quin nombre has multiplicat l’índex ${c.n0} per arribar a ${c.N}? Fes el mateix amb l’exponent.`);
  score();
}
function score(){$('#score').textContent=`Encerts: ${st.ok} de ${st.tot}`;}
function setMode(m){st.mode=m;$('#m-s').setAttribute('aria-pressed',m==='s');$('#m-a').setAttribute('aria-pressed',m==='a');next();}
function setLvl(l){st.lvl=l;$('#l-1').setAttribute('aria-pressed',l===1);$('#l-2').setAttribute('aria-pressed',l===2);next();}
function next(){st.cur=gen();render();}
$('#m-s').onclick=()=>setMode('s');$('#m-a').onclick=()=>setMode('a');
$('#l-1').onclick=()=>setLvl(1);$('#l-2').onclick=()=>setLvl(2);
$('#check').onclick=check;$('#next').onclick=next;
$('#show').onclick=()=>{$('#sol').innerHTML=solution();$('#sol').className='sol on';};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')check();});
score();next();
</script>
<script>(function(){function fix(r){var l=r.querySelectorAll?r.querySelectorAll('mo'):[];Array.prototype.forEach.call(l,function(m){var t=m.textContent.trim();if(t==='(')m.setAttribute('form','prefix');else if(t===')')m.setAttribute('form','postfix');});}fix(document);new MutationObserver(function(ms){ms.forEach(function(m){Array.prototype.forEach.call(m.addedNodes,function(n){if(n.nodeType===1)fix(n);});});}).observe(document.body,{childList:true,subtree:true});})();</script>
